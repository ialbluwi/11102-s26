{% for week in site.data.schedule.su_tue_thu %}
<h2 class="fs-4" id="{{ week.title | slugify }}">
  <span>{{ week.title }}</span>
  <span class="date-range">{{ week.start_date }} - {{ week.end_date }}</span>
</h2>
<div class="module">
  {{ week.content | markdownify }}
</div>

{% if week.title contains '<b>Week 11</b>' %}
<div class="schedule-note">
  ⚠️ The schedule and material below have not been finalized yet.
</div>
{% endif %}

{% endfor %}
